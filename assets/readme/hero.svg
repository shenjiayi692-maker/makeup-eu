<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">EU Cosmetics Annexes, structured</title>
  <desc id="desc">Pages from Annexes II to VI flow through a table grid into 2,490 database records, with 64 uncertain rows held for review.</desc>
  <rect width="1200" height="420" rx="20" fill="#071d49"/>
  <g fill="#f2c94c" opacity=".92">
    <circle cx="69" cy="63" r="5"/><circle cx="90" cy="49" r="5"/><circle cx="115" cy="49" r="5"/><circle cx="136" cy="63" r="5"/><circle cx="144" cy="88" r="5"/><circle cx="136" cy="113" r="5"/><circle cx="115" cy="127" r="5"/><circle cx="90" cy="127" r="5"/><circle cx="69" cy="113" r="5"/><circle cx="61" cy="88" r="5"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="62" y="171" fill="#f2c94c" font-size="18" font-weight="800" letter-spacing="3">REGULATION (EC) NO 1223/2009</text>
    <text x="62" y="238" fill="#f8f3e7" font-size="54" font-weight="770">EU Cosmetics Annexes</text>
    <text x="62" y="291" fill="#c7d1e4" font-size="25">From bordered PDF tables to queryable records.</text>
    <text x="62" y="349" fill="#f8f3e7" font-size="22" font-weight="750">2,490 substances</text>
    <text x="256" y="349" fill="#8697b8" font-size="20">·</text>
    <text x="280" y="349" fill="#f8f3e7" font-size="22" font-weight="750">5 annexes</text>
    <text x="407" y="349" fill="#8697b8" font-size="20">·</text>
    <text x="431" y="349" fill="#f2c94c" font-size="22" font-weight="750">64 held for review</text>
  </g>
  <g transform="translate(683 47)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <g transform="rotate(-4 124 148)">
      <rect width="248" height="295" rx="8" fill="#f7f1e3"/>
      <text x="22" y="35" fill="#23365b" font-size="16" font-weight="700">ANNEX III</text>
      <path d="M22 50 H226 M22 87 H226 M22 124 H226 M22 161 H226 M22 198 H226 M22 235 H226 M22 272 H226 M69 50 V272 M154 50 V272" stroke="#9da6b4"/>
      <g fill="#6b7482" font-size="13"><text x="31" y="74">98</text><text x="78" y="74">SALICYLIC</text><text x="161" y="74">69-72-7</text><text x="31" y="111">99</text><text x="78" y="111">...</text></g>
    </g>
    <path d="M267 150 H337" stroke="#f2c94c" stroke-width="4"/>
    <path d="M327 140 L340 150 L327 160" fill="none" stroke="#f2c94c" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(351 52)">
      <rect width="145" height="230" rx="10" fill="#102b5d" stroke="#49618d"/>
      <text x="18" y="31" fill="#f2c94c" font-size="14">SQLITE</text>
      <g fill="#d9e1ef"><rect x="18" y="52" width="109" height="8" rx="4"/><rect x="18" y="76" width="78" height="8" rx="4"/><rect x="18" y="112" width="109" height="8" rx="4"/><rect x="18" y="136" width="91" height="8" rx="4"/><rect x="18" y="172" width="109" height="8" rx="4"/><rect x="18" y="196" width="67" height="8" rx="4"/></g>
    </g>
  </g>
</svg>
